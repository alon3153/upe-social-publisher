name: Deploy Edge Function

# Supabase edge functions only go live through `supabase functions deploy` — the
# dashboard editor does not deploy, and the CLI login wants a TTY, so functions
# drifted: linkedin-oauth ran a build from 30.06 that had never heard of the
# advocates added since, and handed them a "לינק לא תקין" page. This makes a
# deploy a one-click, repeatable step.
#
# One-time setup: add repository secret SUPABASE_ACCESS_TOKEN
# (Supabase → Account → Access Tokens → Generate new token).

on:
  workflow_dispatch:
    inputs:
      function:
        description: "Function slug under supabase/functions/ (blank = all)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.actor == 'alon3153'
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: nlcbjhpfneutjuscqkjx
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN secret is missing — add it once, then re-run."
            exit 1
          fi
          supabase functions deploy ${{ inputs.function }} \
            --project-ref "$PROJECT_REF" --no-verify-jwt
      - name: Prove the advocate links actually work
        if: inputs.function == '' || inputs.function == 'linkedin-oauth'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        run: |
          fail=0
          for slug in dorin danielle natalia; do
            code=$(curl -s -o /dev/null -w '%{http_code}' \
              "$SUPABASE_URL/functions/v1/linkedin-oauth?advocate=$slug")
            # 302 -> LinkedIn consent = healthy; 200 = the function's error page
            if [ "$code" = "302" ]; then echo "OK  $slug"; else echo "BROKEN $slug (HTTP $code)"; fail=1; fi
          done
          exit $fail
