name: LinkedIn Engage

# Golden-hour squad: advocates comment on fresh UPE LinkedIn posts.
# Runs hourly so a comment lands while the post is still being distributed.
on:
  schedule:
    - cron: "20 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print the comments instead of posting them"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  engage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Comment as advocates
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          LINKEDIN_CLIENT_ID:        ${{ secrets.LINKEDIN_CLIENT_ID }}
          LINKEDIN_CLIENT_SECRET:    ${{ secrets.LINKEDIN_CLIENT_SECRET }}
          ANTHROPIC_API_KEY:         ${{ secrets.ANTHROPIC_API_KEY }}
          ENGAGE_WINDOW_HOURS:       "6"
        run: |
          python3 scripts/linkedin_engage.py \
            ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Persist the "already commented" record
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name "upe-engage-bot"
          git config user.email "alon@upe.co.il"
          git add state/engaged.json 2>/dev/null || true
          git commit -m "chore(engage): advocate comment record $(date -u +%F)" || echo "no change"
          git pull --rebase origin main && git push || echo "push skipped"
