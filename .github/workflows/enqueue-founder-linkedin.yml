name: Enqueue Founder LinkedIn Posts (personal HE)

# Manual one-off: insert the 6 founder-led thought-leadership posts into the
# Supabase approval queue on Alon's personal profile (li_personal). They land as
# PENDING and surface in the daily approval email; publishing happens only after
# Alon approves each one. Text-only posts.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  enqueue:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Enqueue founder LinkedIn posts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python3 scripts/enqueue_founder_linkedin.py --go
