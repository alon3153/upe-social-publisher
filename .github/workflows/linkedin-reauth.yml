name: LinkedIn Reauthorize

# Human consent happens in the browser first. The registered Supabase callback
# stores the bearer credential in a fixed temporary row. This workflow validates
# it for Alon's profile and both company pages, promotes it, then deletes staging.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reauthorize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.actor == 'alon3153'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify and promote callback credential
        env:
          LINKEDIN_CLIENT_ID:        ${{ secrets.LINKEDIN_CLIENT_ID }}
          LINKEDIN_CLIENT_SECRET:    ${{ secrets.LINKEDIN_CLIENT_SECRET }}
          LINKEDIN_MEMBER_URN:       ${{ secrets.LINKEDIN_MEMBER_URN }}
          LINKEDIN_ORG_URN:          ${{ secrets.LINKEDIN_ORG_URN }}
          LINKEDIN_ORG_URN_SPAIN:    ${{ secrets.LINKEDIN_ORG_URN_SPAIN }}
          LINKEDIN_REDIRECT_URI:     https://nlcbjhpfneutjuscqkjx.supabase.co/functions/v1/linkedin-oauth
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GH_TOKEN:                  ${{ secrets.GH_PAT }}
          GITHUB_REPOSITORY:         ${{ github.repository }}
        run: python3 scripts/linkedin_org_oauth.py --promote-callback
