name: Approval Queue Status

# Read-only. Shows which approval rows are pending/approved/failed and why.
# Sends nothing and changes nothing.
on:
  workflow_dispatch:
    inputs:
      day:
        description: "Only this content day (blank = all unfinished rows)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.actor == 'alon3153'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Report approval queue state
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python3 scripts/approval_queue_status.py "${{ inputs.day }}"
