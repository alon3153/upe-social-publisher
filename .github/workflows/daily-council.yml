name: Daily Marketing Council

on:
  schedule:
    # 05:30 UTC = 08:30 IST — fresh audit waiting before the workday + before the day's publish
    - cron: "30 5 * * *"
  workflow_dispatch:
    inputs:
      days:
        description: "review window in days"
        required: false
        default: "7"
      send_email:
        description: "Send the report by email"
        type: boolean
        default: false

concurrency:
  group: daily-council
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  council:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Run daily council
        env:
          ANTHROPIC_API_KEY:      ${{ secrets.ANTHROPIC_API_KEY }}
          COUNCIL_MODEL:          ${{ vars.COUNCIL_MODEL }}
          METRICOOL_TOKEN:        ${{ secrets.METRICOOL_TOKEN }}
          METRICOOL_USER_ID:      ${{ secrets.METRICOOL_USER_ID }}
          METRICOOL_BLOG_ID:      ${{ secrets.METRICOOL_BLOG_ID }}
          GH_PAT:                 ${{ secrets.GH_PAT }}
          SALESFORCE_INSTANCE_URL: ${{ secrets.SALESFORCE_INSTANCE_URL }}
          SALESFORCE_CLIENT_ID:    ${{ secrets.SALESFORCE_CLIENT_ID }}
          SALESFORCE_CLIENT_SECRET: ${{ secrets.SALESFORCE_CLIENT_SECRET }}
          APPROVAL_TO:            ${{ secrets.APPROVAL_TO }}
          MS_GRAPH_TENANT_ID:     ${{ secrets.MS_GRAPH_TENANT_ID }}
          MS_GRAPH_CLIENT_ID:     ${{ secrets.MS_GRAPH_CLIENT_ID }}
          MS_GRAPH_CLIENT_SECRET: ${{ secrets.MS_GRAPH_CLIENT_SECRET }}
          MS_GRAPH_FROM:          ${{ secrets.MS_GRAPH_FROM }}
          REVIEW_DAYS:            ${{ inputs.days || '7' }}
          SEND_EMAIL:             ${{ github.event_name == 'schedule' || inputs.send_email == true }}
        run: |
          args=(--days "$REVIEW_DAYS")
          if [ "$SEND_EMAIL" = "true" ]; then args+=(--send-email); fi
          python3 scripts/council.py "${args[@]}"
      - name: Save reviewable report and source evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: council-report
          path: |
            reports/council/
            reports/metrics/
          retention-days: 14
      - name: Commit report + directives
        if: always()
        run: |
          git config user.name  "upe-council-bot"
          git config user.email "bot@upe.co.il"
          git add reports/council reports/metrics state
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "council: daily report $(date -u +%F)"
          for attempt in 1 2 3; do
            git pull --rebase -q origin main
            if git push origin HEAD:main; then exit 0; fi
          done
          echo "Failed to persist council report after three attempts" >&2
          exit 1
