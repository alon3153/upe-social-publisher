name: Weekly AEO Loop
on:
  schedule:
    - cron: "0 5 * * 0"        # Sundays 05:00 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run without opening a PR or sending email"
        type: boolean
        default: false

# Two overlapping runs both rewrite state/held_pages.json + aeo_history.json and then
# race to push. On 02.08.2026 a manual dispatch and the scheduled run overlapped, the
# second one hit "CONFLICT (content): state/held_pages.json" during `git pull --rebase`
# and the whole persist step died — that week's scorecard was computed and then thrown
# away. Serialise instead of cancelling: a probe that already burned API credit must be
# allowed to finish and persist.
concurrency:
  group: aeo-state-write
  cancel-in-progress: false

jobs:
  aeo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout engine (upe-sp)
        uses: actions/checkout@v4

      - name: Checkout content repo (uproduction-astro)
        uses: actions/checkout@v4
        with:
          repository: alon3153/uproduction-astro
          token: ${{ secrets.GH_PAT }}
          path: astro
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest tests/aeo -q

      - name: Configure git for content repo
        run: |
          git -C astro config user.name "upe-aeo-bot"
          git -C astro config user.email "alon@upe.co.il"

      - name: Run AEO loop
        env:
          ANTHROPIC_API_KEY:      ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY:         ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY:         ${{ secrets.GEMINI_API_KEY }}
          GH_PAT:                 ${{ secrets.GH_PAT }}
          GH_TOKEN:               ${{ secrets.GH_PAT }}
          ASTRO_REPO:             astro
          MS_GRAPH_TENANT_ID:     ${{ secrets.MS_GRAPH_TENANT_ID }}
          MS_GRAPH_CLIENT_ID:     ${{ secrets.MS_GRAPH_CLIENT_ID }}
          MS_GRAPH_CLIENT_SECRET: ${{ secrets.MS_GRAPH_CLIENT_SECRET }}
          MS_GRAPH_FROM:          ${{ secrets.MS_GRAPH_FROM }}
          APPROVAL_TO:            ${{ secrets.APPROVAL_TO }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python scripts/aeo_run.py --dry-run
          else
            python scripts/aeo_run.py
          fi

      - name: Persist scorecard history + citation/veto state
        if: ${{ inputs.dry_run != true }}
        run: |
          git config user.name "upe-aeo-bot"
          git config user.email "alon@upe.co.il"
          # held_pages.json carries the founder-veto window; citations.json the
          # external-citation states — both MUST persist across runs or the veto
          # window never accumulates and citations re-verify from scratch.
          # published_intents.json is the dedup ledger: without it every run starts
          # believing nothing has been published and rewrites covered intents, which
          # is the treadmill that produced 27 URLs on a single intent.
          git add scripts/aeo_history.json state/held_pages.json state/citations.json \
                  state/published_intents.json 2>/dev/null || true
          git commit -m "chore(aeo): scorecard + citation/veto state $(date -u +%F)" || echo "no change"
          # Retry the rebase+push: other jobs (daily monitor, council) push to main
          # constantly, so a single attempt loses the race often enough to matter.
          # Always abort a half-finished rebase before retrying, or the next attempt
          # runs inside a broken rebase state and fails for the wrong reason.
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push; then
              echo "persisted on attempt $attempt"; exit 0
            fi
            git rebase --abort || true
            sleep $((attempt * 10))
          done
          echo "::error::AEO state could not be persisted after 3 attempts — this run's scorecard is NOT on main"
          exit 1
