name: Marketing Executor (agent-team)

on:
  schedule:
    # 06:30 UTC = 09:30 IST — one hour after the council (05:30) so it acts on fresh recs
    - cron: "30 6 * * *"
  workflow_dispatch:
    inputs:
      max:
        description: "max initiatives to advance this run"
        required: false
        default: "6"

permissions:
  contents: write

concurrency:
  group: marketing-executor
  cancel-in-progress: false

jobs:
  executor:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'schedule' || github.actor == 'alon3153'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Run executor
        timeout-minutes: 25
        env:
          ANTHROPIC_API_KEY:      ${{ secrets.ANTHROPIC_API_KEY }}
          EXECUTOR_MODEL:         ${{ vars.EXECUTOR_MODEL }}
          APPROVAL_TO:            ${{ secrets.APPROVAL_TO }}
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          APPROVAL_HMAC_SECRET:      ${{ secrets.APPROVAL_HMAC_SECRET }}
          MS_GRAPH_TENANT_ID:     ${{ secrets.MS_GRAPH_TENANT_ID }}
          MS_GRAPH_CLIENT_ID:     ${{ secrets.MS_GRAPH_CLIENT_ID }}
          MS_GRAPH_CLIENT_SECRET: ${{ secrets.MS_GRAPH_CLIENT_SECRET }}
          MS_GRAPH_FROM:          ${{ secrets.MS_GRAPH_FROM }}
          MAX_INITIATIVES:        ${{ inputs.max || '6' }}
        run: python3 -u scripts/executor.py --max "$MAX_INITIATIVES"
      - name: Preserve executor checkpoints
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: executor-evidence
          path: |
            reports/executor.json
            state/initiatives.json
            deliverables
          if-no-files-found: error
          retention-days: 14
      - name: Commit initiatives + deliverables
        if: always()
        run: |
          git config user.name  "upe-executor-bot"
          git config user.email "bot@upe.co.il"
          git add state/initiatives.json deliverables
          if [ -f reports/executor.json ]; then
            git add -f reports/executor.json
          fi
          if ! git diff --cached --quiet; then
            git commit -m "executor: checkpoint initiatives $(date -u +%F)"
            git pull --rebase -q origin main
            git push
          fi
