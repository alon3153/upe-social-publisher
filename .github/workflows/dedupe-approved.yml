name: Dedupe Approved

# Rejects duplicate live copies so a day cannot publish twice.
# Dry-run unless apply=true.
on:
  workflow_dispatch:
    inputs:
      day:
        description: "Only this content day (blank = all)"
        required: false
        default: ""
      apply:
        description: "Actually reject the extra copies"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  dedupe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.actor == 'alon3153'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Reject duplicate live rows
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          APPLY: ${{ inputs.apply == true }}
          DAY: ${{ inputs.day }}
        run: |
          args=()
          if [ "$APPLY" = "true" ]; then args+=(--apply); fi
          if [ -n "$DAY" ]; then args+=("$DAY"); fi
          python3 scripts/dedupe_approved.py "${args[@]}"
