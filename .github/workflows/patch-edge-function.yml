name: Patch Edge Function Constant

# Surgical, reversible edit of a literal inside a *deployed* edge function whose source is
# not in this repo — the situation `approve/index.ts` warns about, and exactly where
# opa-register sits today: it enforces a passport-validity floor that turned away a real
# registrant (Barak Toledano, 20.08.2026) and nobody can read the line that does it.
#
# The source is downloaded, patched, deployed, and thrown away. It is never committed and
# never printed: this repo is PUBLIC, so are its Actions logs, and opa-register handles
# passport data. Only match counts are logged.
#
# Reversing a change is the same run with `from` and `to` swapped.
#
# Requires repository secret SUPABASE_ACCESS_TOKEN — a Supabase personal access token
# (Supabase -> Account -> Access Tokens). Nothing else here can deploy a function: the
# service-role key is injected into functions at runtime and cannot deploy, and the
# dashboard editor does not deploy at all.

on:
  workflow_dispatch:
    inputs:
      function:
        description: "Function slug (e.g. opa-register)"
        required: true
      from:
        description: "Literal to replace (e.g. 2027-04-08)"
        required: true
      to:
        description: "Replacement literal (e.g. 2027-01-08)"
        required: true
      expect_matches:
        description: "How many occurrences of `from` must be present. A different count aborts before deploying."
        required: true
        default: "1"
      probe:
        description: "Post-deploy regression probe to run (opa-register, or none)"
        required: false
        default: "none"

permissions:
  contents: read

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.actor == 'alon3153'
    env:
      PROJECT_REF: nlcbjhpfneutjuscqkjx
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      FROM: ${{ inputs.from }}
      TO: ${{ inputs.to }}
      SLUG: ${{ inputs.function }}
      EXPECT: ${{ inputs.expect_matches }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Require the deploy token
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN is missing. Create a personal access token at" \
                 "https://supabase.com/dashboard/account/tokens and add it as a repository secret."
            exit 1
          fi

      - name: Download the deployed source
        run: |
          supabase functions download "$SLUG" --project-ref "$PROJECT_REF"
          test -d "supabase/functions/$SLUG" || { echo "::error::download produced nothing"; exit 1; }
          echo "files downloaded: $(find "supabase/functions/$SLUG" -type f | wc -l)"

      - name: Patch the literal
        run: |
          dir="supabase/functions/$SLUG"
          # `functions download` extracts from an eszip and leaves the files read-only,
          # so the patch dies with EACCES before it writes a byte.
          chmod -R u+w "$dir"
          # Count first. A literal that appears an unexpected number of times means the
          # function is not shaped the way we assume, and guessing is how a live
          # registration endpoint gets broken. Counts are of matches, not lines.
          before=$(grep -roF -- "$FROM" "$dir" | wc -l | tr -d ' ')
          echo "occurrences of the search literal: $before (expected $EXPECT)"
          if [ "$before" != "$EXPECT" ]; then
            echo "::error::expected $EXPECT occurrence(s), found $before — not deploying."
            exit 1
          fi
          # A literal replace, not sed: `&` and `|` in a sed replacement are magic, and a
          # future caller will eventually pass a literal that contains one. Kept on one
          # line because an unindented line would close this block scalar.
          grep -rlF -- "$FROM" "$dir" | while read -r f; do
            python3 -c "import io,os,sys; p=sys.argv[1]; s=io.open(p,encoding='utf-8').read(); io.open(p,'w',encoding='utf-8').write(s.replace(os.environ['FROM'],os.environ['TO']))" "$f"
          done
          after_from=$(grep -roF -- "$FROM" "$dir" | wc -l | tr -d ' ')
          after_to=$(grep -roF -- "$TO" "$dir" | wc -l | tr -d ' ')
          echo "after patch — search literal: $after_from, replacement: $after_to"
          if [ "$after_from" != "0" ] || [ "$after_to" -lt "$EXPECT" ]; then
            echo "::error::patch did not apply cleanly — not deploying."
            exit 1
          fi

      - name: Deploy
        run: supabase functions deploy "$SLUG" --project-ref "$PROJECT_REF" --no-verify-jwt

      - name: Probe — opa-register still validates, and the new floor is live
        if: inputs.probe == 'opa-register'
        run: |
          URL="https://$PROJECT_REF.supabase.co/functions/v1/opa-register"
          fail=0
          # Every probe deliberately omits the acknowledgements, so validation runs to the
          # end and nothing is ever written. `missing_ack` is the marker for "everything
          # before the acks passed".
          probe () {   # probe <label> <expected-substring> <extra curl args...>
            label="$1"; want="$2"; shift 2
            out=$(curl -s -X POST "$URL" \
              -F "fnameHe=בדיקה" -F "lnameHe=בדיקה" -F "fnameEn=TEST" -F "lnameEn=PROBE" \
              -F "idnum=000000018" -F "email=alon@upe.co.il" -F "phone=0522090040" \
              -F "birth=1990-01-01" -F "gender=זכר" -F "dept=בדיקה" \
              -F "passCountry=ישראל" -F "diet=רגיל" \
              -F "emergency_name=בדיקה" -F "emergency_phone=0522090040" \
              -F "ecName=בדיקה" -F "ecPhone=0522090040" "$@")
            if echo "$out" | grep -qF -- "$want"; then
              echo "OK      $label"
            else
              echo "BROKEN  $label — wanted '$want', got: $out"; fail=1
            fi
          }
          # the goal: Barak Toledano's real expiry must clear the passport gate
          probe "05.03.2027 (Barak) accepted"  'missing_ack'               -F passport=12345678 -F passExp=2027-03-05
          # the new floor holds in both directions
          probe "08.01.2027 accepted"          'missing_ack'               -F passport=12345678 -F passExp=2027-01-08
          probe "07.01.2027 still refused"     'passport_expires_too_soon' -F passport=12345678 -F passExp=2027-01-07
          # the rest of the validation must survive the download/redeploy round-trip
          probe "letters in passport refused"  'bad_passport'              -F passport=T1234567 -F passExp=2028-01-01
          probe "short phone refused"          'bad_phone'                 -F passport=12345678 -F passExp=2028-01-01 -F phone=052209
          if [ "$fail" != "0" ]; then
            echo "::error::the deployed function misbehaves. Re-run with from/to swapped to restore."
            exit 1
          fi
          echo "all probes passed"
