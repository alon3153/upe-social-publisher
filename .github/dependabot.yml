# Supply-chain hygiene (OWASP A03:2025 Software Supply Chain Failures):
# keep the runner actions and the Python dependencies current with reviewable PRs.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
