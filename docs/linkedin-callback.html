<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UPE — LinkedIn OAuth Callback</title>
<style>
  body { font-family: -apple-system, Segoe UI, Arial, sans-serif; background: #111; color: #eee; padding: 40px 20px; max-width: 720px; margin: 0 auto; text-align: center; }
  h1 { color: #0A66C2; margin-bottom: 8px; }
  .sub { color: #888; margin-bottom: 30px; font-size: 14px; }
  .code-box { background: #222; padding: 24px; border-radius: 12px; margin: 20px 0; border: 1px solid #333; word-break: break-all; }
  .label { color: #0A66C2; font-size: 14px; margin-bottom: 8px; }
  .code { font-family: 'SF Mono', Monaco, monospace; font-size: 15px; color: #4ade80; user-select: all; cursor: pointer; }
  .error { color: #f87171; }
  button { background: #0A66C2; color: #fff; border: none; padding: 12px 28px; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 14px; margin-top: 10px; }
  button:hover { background: #0d7ae0; }
  .footer { color: #666; font-size: 12px; margin-top: 40px; }
</style>
</head>
<body>
<h1>UPE — LinkedIn OAuth</h1>
<p class="sub">קוד האימות התקבל. העתק והדבק בטרמינל.</p>

<div id="result"></div>

<script>
// Every value below comes from the URL (attacker-controllable on a public page).
// Render with textContent / DOM APIs only; no HTML string assembly, no inline handlers.
const params = new URLSearchParams(window.location.search);
const code = params.get('code');
const error = params.get('error');
const errorDesc = params.get('error_description');
const state = params.get('state');
const out = document.getElementById('result');

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}
function meta(text) {
  const d = el('div', null, text);
  d.style.cssText = 'font-size:12px;color:#666;margin-top:10px;';
  return d;
}

const box = el('div', 'code-box');
if (error) {
  box.appendChild(el('div', 'label', '❌ שגיאה'));
  box.appendChild(el('div', 'code error', error));
  if (errorDesc) {
    const d = el('div', null, errorDesc);
    d.style.cssText = 'color:#aaa;margin-top:10px;font-size:13px;';
    box.appendChild(d);
  }
  out.appendChild(box);
} else if (code) {
  box.appendChild(el('div', 'label', '✅ קוד אימות (לחץ להעתקה)'));
  const codeEl = el('div', 'code', code);
  codeEl.id = 'code-text';
  box.appendChild(codeEl);
  const btn = el('button', null, '📋 העתק קוד');
  btn.addEventListener('click', () => {
    navigator.clipboard.writeText(code).then(() => { btn.textContent = 'הועתק ✓'; });
  });
  box.appendChild(btn);
  out.appendChild(box);
  if (state) out.appendChild(meta('state: ' + state));
  const hint = el('p', 'sub', 'חזור לטרמינל והדבק את הקוד בבקשה.');
  hint.style.marginTop = '30px';
  out.appendChild(hint);
} else {
  box.appendChild(el('div', 'error', 'לא נמצא קוד או שגיאה ב-URL'));
  out.appendChild(box);
}
</script>

<p class="footer">Uproduction Events · upe.co.il</p>
</body>
</html>
